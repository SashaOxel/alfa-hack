syntax = "proto3";

package alfa.core.v1;

import "google/api/annotations.proto";

option go_package = "github.com/sashaoxel/alfa-hack/backend/gen/alfa/core/v1;corev1";

// Только DEMO_MODE; вне демо-режима возвращает NOT_FOUND.
service DemoService {
  // Сбрасывает демо-мир: заявки, чаты, согласия, выданные кредиты.
  rpc Reset(ResetRequest) returns (ResetResponse) {
    option (google.api.http) = {
      post: "/api/v1/demo/reset"
      body: "*"
    };
  }
}

message ResetRequest {}

message ResetResponse {}
